[package]
name = "data_quality"
version = "0.1.0"
edition = "2021"
description = "DuckDB Data Quality extension — data profiling, validation, and expectation checks in pure SQL"
license = "MIT"
repository = "https://github.com/alitrack/duckdb-data-quality"

[lib]
name = "data_quality"
crate-type = ["cdylib"]

[dependencies]
quack-rs = { version = "0.15", features = ["duckdb-1-5"] }
libduckdb-sys = ">=1.5.4, <2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
